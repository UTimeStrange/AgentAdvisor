# ============================================================
# Agent Advisor - 多智能体投顾系统配置
# ============================================================

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8000

# 大模型配置
llm:
  # 当前使用的 provider: openai / deepseek / claude
  default_provider: "openai"

  providers:
    openai:
      model: "gpt-4o"
      api_url: "https://api.openai.com/v1/chat/completions"
      # api_key 从环境变量 OPENAI_API_KEY 读取
      temperature: 0.3
      max_tokens: 8192

    deepseek:
      model: "deepseek-chat"
      api_url: "https://api.deepseek.com/v1/chat/completions"
      # api_key 从环境变量 DEEPSEEK_API_KEY 读取
      temperature: 0.3
      max_tokens: 8192

    claude:
      model: "claude-sonnet-4-20250514"
      api_url: "https://api.anthropic.com/v1/messages"
      # api_key 从环境变量 ANTHROPIC_API_KEY 读取
      temperature: 0.3
      max_tokens: 8192

# 邮件推送配置
email:
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  sender: ""
  # password 从环境变量 EMAIL_PASSWORD 读取
  receivers: []

# 定时任务配置
scheduler:
  # 每日监控时间 (24小时制)
  monitor_hour: 18
  monitor_minute: 0

# 数据配置
data:
  cache_dir: "data"
  # 横截面数据缓存过期天数
  cross_section_expire_days: 1
  # 时序数据缓存过期天数
  time_series_expire_days: 1

